<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Ansh Shah</title>
  <meta name="description" content="Full portfolio of Ansh Shah, Bachelor of Architectural Studies student at Carleton University.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="sticky-nav">
    <span class="nav-name">ANSH SHAH</span>
    <ul class="nav-links">
      <li><a href="index.html#work">Work</a></li>
      <li><a href="portfolio.html" class="active">Portfolio</a></li>
    </ul>
  </nav>

  <!-- Flipbook Section -->
  <section class="flipbook-section">
    <div class="flipbook-header">
      <p class="hero-label">- Full Portfolio</p>
      <h2>Ansh Shah / 2026</h2>
    </div>

    <div id="loading-state" class="portfolio-loading">
      <div class="loader-ring"></div>
      <p>Loading portfolio pages...</p>
    </div>

    <div class="flipbook-stage">
      <button id="btn-prev" class="flipbook-arrow flipbook-arrow-prev" aria-label="Previous page">&larr;</button>

      <div id="flipbook-wrapper">
        <div id="flipbook" class="jpg-flipbook"></div>
      </div>

      <button id="btn-next" class="flipbook-arrow flipbook-arrow-next" aria-label="Next page">&rarr;</button>
    </div>

    <div class="portfolio-progress">
      <input id="page-slider" type="range" min="1" value="1" step="1" aria-label="Portfolio progress">
      <div class="progress-meta">
        <span id="page-counter">Page <span id="current-page">1</span> of <span id="total-pages">-</span></span>
        <span id="progress-percent">0%</span>
      </div>
    </div>

    <p class="flipbook-hint">Click page edges to flip / Drag to turn / Keyboard arrows also work</p>
  </section>

  <!-- Footer -->
  <footer class="footer-dark">
    <p>&copy; 2026 Ansh Shah &nbsp;|&nbsp; <a href="mailto:ansh-shah@outlook.com">ansh-shah@outlook.com</a></p>
  </footer>

  <!-- StPageFlip for flipbook interaction -->
  <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

  <!-- Main scripts -->
  <script src="js/main.js"></script>
  <script src="js/flipbook.js"></script>
</body>
</html>
